name: Dagger CI
on:
  push:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get Dagger version
        id: dagger_version
        uses: sagikazarmark/dagger-version-action@250543f4f12e1aa0161bd427eeb48ce3710fb408 # v0.0.2
      - name: Call Dagger Function
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        with:
          version: ${{ steps.dagger_version.outputs.version }}
          call: --is-ci=true run-ci
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

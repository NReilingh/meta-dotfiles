name: Dagger CI
on:
  push:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get Dagger version
        id: dagger_version
        uses: sagikazarmark/dagger-version-action@71fb35824ad241172a822546694a4fc68631eafd # v0.0.3
      - name: Call Dagger Function
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ steps.dagger_version.outputs.version }}
          call: --is-ci=true run-ci
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
